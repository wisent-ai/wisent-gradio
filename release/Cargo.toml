[package]
name = "wisent-gradio-release"
edition = "2021"
description = "The baseline of the wisent-gradio Python package: the surface of the version PyPI serves"
license = "MIT"
publish = false

[[bin]]
name = "wisent-gradio-release"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde_json = "1"
tar = "0.4"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
